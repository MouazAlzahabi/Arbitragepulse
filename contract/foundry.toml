[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 1000
via_ir = true

# Anvil fork for integration tests
[profile.default.rpc_endpoints]
optimism = "${OPTIMISM_RPC}"
base = "${BASE_RPC}"
gnosis = "${GNOSIS_RPC}"
local = "http://127.0.0.1:8545"

# Etherscan verification
[etherscan]
optimism = { key = "${OPTIMISTIC_ETHERSCAN_API_KEY}", chain = 10, url = "https://api-optimistic.etherscan.io/api" }
base = { key = "${BASESCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }

# Formatting
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
