[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Cancun: Base runs it, and the Uniswap V4 PoolManager (borrowing) uses transient storage.
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
via_ir = true

# Anvil fork for integration tests
[rpc_endpoints]
base = "${BASE_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
local = "http://127.0.0.1:8545"

# Verification — Foundry uses the Etherscan API V2 by default (one etherscan.io key covers
# Base and Base Sepolia; it adds the chainid itself, so no url here).
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

# Formatting
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
