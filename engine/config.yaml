# ─── TUNING ────────────────────────────────────────────────
# Every timing and threshold, with the values tuned for Base. All keys are optional —
# omit one to use the default shown. Unknown keys are rejected. Keys marked
# "block-relative" default to a multiple of chain.block_time_ms when omitted.
tuning:
  # ── Execution ──
  gas_limit_2hop: 700000
  gas_limit_triangular: 900000
  onchain_min_profit_bps: 6076           # on-chain minProfit = 60.76% of the gas-cost floor
                                         # (replaces router_min_out_slack_bps × sell_leg_minprofit_mul_bps:
                                         #  (10000 − slack) × mul / 10000; old 200 / 6200 → 6076)
  gas_fallback_margin_bps: 2500          # last known gas price +25% if a fetch fails
  gas_fallback_max_age_ms: 120000        # …only if it is at most this old
  # Profit-based tip (off at 0): tip per gas = max(priority_fee_wei, share × gross profit
  # ÷ gas limit), capped at tip_max_wei. The tip is paid on reverts too, so a share raises
  # the cost of every lost race; set it from arb_lost_race_total{cause="tip"}. The tip is
  # counted in the gas cost, so the net-profit gate and on-chain floor still cover it.
  tip_profit_share_bps: 0                # e.g. 1000 = up to 10% of gross profit (max 9000)
  tip_max_wei: 2000000000                # 2 gwei per gas cap
  # ── Detection ──
  quoter_haircut_bps: 15
  p15_gate_spread: 0.00005               # local spread that triggers QuoterV2 verification
  min_v3_liquidity: 1000000000
  v3_spot_max_vr_fraction_bps: 200
  v3_spot_overestimate_bps: 30           # per V3 leg, optimistic mode only
  phantom_cap_bps: 500                   # profit > 5% of input = phantom quote
  tri_verify_max_rounds: 3
  tri_verify_bracket_bps: 100
  tri_verify_max_gap_bps: 10
  optimizer_coarse_steps: 5
  optimizer_fine_steps: 5
  optimizer_large_spread: 0.05
  volatile_pool_max_age_ms: 120000
  stable_pool_max_age_ms: 30000
  v3_fresh_window_ms: 30000
  # ── RPC ──
  rpc_read_timeout_ms: 5000
  # rpc_simulate_timeout_ms: 1000        # block-relative: ½ block
  rpc_send_timeout_ms: 5000
  multicall_chunk_size: 10
  multicall_chunk_timeout_ms: 3000
  discover_chunk_size: 20
  discover_call_timeout_ms: 15000
  # quote_cache_max_age_ms: 6000         # block-relative: 3 blocks
  quote_cache_max_pools: 1024
  health_hold_base_ms: 10000             # execution off after an RPC outage, at least
  health_hold_max_ms: 80000              # repeated relapses double up to this
  health_relapse_window_ms: 60000
  # health_monitor_every_ms: 2000        # block-relative: 1 block
  quoter_never_ok_warn_after_ms: 30000
  quoter_broken_warn_after_ms: 300000
  quoter_warn_min_batches: 5
  rate_limit_log_every_ms: 30000
  # ── Scan loop ──
  cooldown_secs: 15
  send_cooldown_secs: 15
  gas_reject_cooldown_secs: 60
  max_consecutive_failures: 20           # circuit breaker (RPC outages don't count)
  slow_scan_warn_ms: 10000
  heartbeat_stall_warn_ms: 30000
  block_stall_exit_ms: 300000         # no new block this long → exit 1, systemd restarts (fallback RPCs)
  price_refresh_ms: 60000
  balance_refresh_ms: 30000
  config_reload_ms: 30000
  ws_reconnect_max_backoff_ms: 30000
