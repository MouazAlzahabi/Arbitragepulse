# ============================================================
# ArbitragePulse Engine — Base mainnet (production)
# ============================================================
# One config file = one chain = one engine instance. To trade another chain, deploy
# another instance with its own config, .env, PORT and database (see
# PRODUCTION_DEPLOYMENT_GUIDE.md). Testing stage: config-testnet.yaml (Base Sepolia).
#
# Profit floors (chain.min_profit_usd, min_triangular_profit_usd, per-pair min_profit_usd)
# hot-reload every `tuning.config_reload_ms`. Adding pairs or routers needs a restart
# (pools are discovered at startup). The rest of `chain:` and `tuning:` need a restart.
# ============================================================


# ─── CHAIN ─────────────────────────────────────────────────
chain:
  id: 8453
  name: "Base"
  ws_rpc: "wss://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
  http_rpc: "https://mainnet.base.org"
  native_currency: "ETH"
  wrapped_native: "0x4200000000000000000000000000000000000006"
  block_time_ms: 2000
  contract_address: "0xF8aa9d575CEccdFed211383Cd3979241d9C6E0c2"
  min_native_balance: 0.005
  # ~$1k capital: keep USD floor low (defer revert-plan 1.2 $0.30–$0.80). Revert risk is handled
  # off-chain only — P15 haircut + Phase 1.5 QuoterV2 + net-after-gas > 0. The on-chain minProfit is
  # deliberately loosened (62% of gas floor, 2% router slack), so it does NOT filter thin edges.
  min_profit_usd: 0.0001
  deadline_seconds: 120
  quoter_v2_address: "0x3d4e44Eb1374240CE5F1B871ab261CD16335B76a"  # Uniswap V3 QuoterV2 (Base)
  scan_interval_ms: 2000
  rpc_concurrency: 3
  # Extra HTTP endpoints to broadcast signed txs concurrently (FCFS sequencer — race to arrive first)
  # Flashblocks: pool events from 200 ms pre-confirmed sub-blocks (eth_subscribe
  # "pendingLogs"), measured ~1.2 s (p50) before the sealed block. Read-only, keyless.
  # Sealed-block logs stay on as the source of truth. Remove the line to turn it off.
  preconf_ws_rpc: "wss://mainnet-preconf.base.org"
  # Quotes (QuoterV2/Multicall3), optimizer and simulation at block tag `pending` here, so
  # they price the same pre-confirmed state the logs above moved the pool cache to. The
  # public http_rpc serves Flashblocks `pending` (checked 2026-10-22): same endpoint and
  # rate limits as today, ~+25 ms per call. Check others with scripts/rpc-latency.sh.
  # Remove the line to quote at `latest` on http_rpc.
  preconf_http_rpc: "https://mainnet.base.org"
  ws_rpc_fallbacks:
    - "wss://mainnet.base.org"                              # public fallback (no mempool, blocks only)
  submission_rpcs:
    - "https://mainnet-sequencer.base.org"                     # Direct OP Stack sequencer (bypasses CDN)
    - "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"  # Alchemy parallel submit
    - "https://base.llamarpc.com"                              # LlamaRPC parallel submit
  # Submit immediately after Phase 1 local quotes — skip QuoterV2 (~80-160ms saved).
  # Re-enabled QuoterV2 verification: primary RPC is now wss://mainnet.base.org
  # so we're at block position ~1-10 even with the extra ~80-160ms for V3 quotes.
  # Phantom V3 spreads (virtual reserves overestimate by ~0.17%) are caught here.
  # Traced mined reverts on Base often show Phase-1 phantom edges vs actual V3 liquidity (final balance <
  # starting balance + minProfit). QuoterV2 preflight trades latency for fewer guaranteed reverts until the
  # pipeline nets its first confirmations.
  optimistic_submission: false  # Phase 1.5 QuoterV2 (~80–160ms) — restores bestV= in heartbeat
  # preflight_eth_call: true     # eth_call before send — logs revert reason in engine (adds ~100–250ms latency)
  # Applies to EVERY triangular route. V3-leg routes are QuoterV2-verified first (revert plan 1.4),
  # so for them this is checked against verified profit and no longer absorbs the ~0.30% V3 spot
  # overestimate the old $0.80 covered. V2/Solidly/Aerodrome-only routes are NOT re-verified: they
  # rely on event-sourced reserves (exact xy=k / stable curve) + 15 bps haircut + 5% sanity cap.
  # If those routes start reverting, raise this floor — it is the only extra guard they have.
  # With optimistic_submission: true, V3-leg routes are submitted UNVERIFIED on spot quotes; the
  # engine then deducts the ~0.30% V3 overestimate (V3_SPOT_OVERESTIMATE_BPS) before this floor.
  min_triangular_profit_usd: 0.15
  optimize_size: false          # skip adaptive size optimizer (~80-100ms saved per opportunity)
  priority_fee_wei: 10000000    # 10 Mwei floor — pending monitor uses max(trigger_tip, this); block 44487221 showed pos-1 at 15000 Mwei (trigger_tip dominates for pending path)
  pending_tx_monitoring: true   # monitor mempool for large swaps before they confirm → same-block arb
  pending_only_submission: false # only submit TXs from pending monitor path; block/poll scans detect but don't submit (avoids pos 500+ failures)
  poll_logs_fallback: false     # Alchemy WS logs are live — skip duplicate eth_getLogs polling


# ─── ROUTERS ───────────────────────────────────────────────
routers:
  - id: "uniswap-v3-base"
    name: "Uniswap V3 (Base)"
    address: "0x2626664c2603336E57B271c5C0b26F421741e481"  # SwapRouter02
    type: "v3"
    fee_tiers: [100, 500, 3000, 10000]
    fee_bps: 0
    factory_address: "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"  # Uniswap V3 Factory (Base)

  - id: "aerodrome-base"
    name: "Aerodrome V2 (Base)"
    address: "0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43"
    type: "aerodrome"    # 4-field Route{from,to,stable,factory}
    fee_bps: 30        # volatile pools (0.3%)
    stable_fee_bps: 5  # stable pools (0.05%, factory stableFee()): USDC/USDT, USDC/EURC, etc.
    # Both are fallbacks only: discovery reads each pool's actual fee via factory.getFee(pool, stable)
    # (pools can carry a custom fee, e.g. USDC/AERO stable = 200 bps) and uses these when that call fails.
    # Aerodrome Router V2 exposes defaultFactory() not factory() — must be configured explicitly.
    factory_address: "0x420DD381b31aEf6683db6B902084cB0FFECe40Da"
    # IMPORTANT: Must be whitelisted on-chain after contract redeployment:
    #   executor.setRouter(0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43, 4)   # 4 = Aerodrome

  # Aerodrome Slipstream (concentrated liquidity). Same pool events as Uniswap V3, but pools
  # are keyed by tick spacing: fee_tiers lists TICK SPACINGS here (they travel in every `fee`
  # field), and each pool's swap fee is read at discovery (e.g. WETH/USDC ts 100 = 0.015%).
  # Executor type 5 — needs the contract with the Slipstream router type:
  #   executor.setRouter(0xBE6D8f0d05cC4be24d5167a3eF062215bE6D18a5, 5)
  - id: "aerodrome-slipstream-base"
    name: "Aerodrome Slipstream (Base)"
    address: "0xBE6D8f0d05cC4be24d5167a3eF062215bE6D18a5"   # Slipstream SwapRouter
    type: "v3"
    slipstream: true
    fee_tiers: [1, 10, 50, 100, 200, 2000]                   # factory.tickSpacings()
    fee_bps: 0
    quoter_address: "0x254cF9E1E6e233aa1AC962CB9B05b2cfeAaE15b0"   # Slipstream QuoterV2
    factory_address: "0x5e7BB104d84c7CB9B682AaC2F3d509f5F406809A"  # Slipstream CLFactory

  - id: "pancake-v3-base"
    name: "PancakeSwap V3 (Base)"
    address: "0x678Aa4bF4E210cf2166753e054d5b7c31cc7fa86"  # SmartRouter (7-field exactInputSingle, no deadline in struct)
    type: "v3"
    fee_tiers: [100, 500, 2500]
    fee_bps: 5
    quoter_address: "0xB048Bbc1Ee6b733FFfCFb9e9CeF7375518e25997"  # PancakeSwap QuoterV2
    factory_address: "0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865"  # PancakeV3Factory

  # baseswap-v2 disabled: $29K USDC/WETH TVL → 0.8% price impact on $90 → confirmed reverts
  # - id: "baseswap-v2"
  #   name: "BaseSwap (Base)"
  #   address: "0x327Df1E6de05895d2ab08513aaDD9313Fe505d86"
  #   type: "v2"
  #   fee_bps: 30

  # alienbase-v2 disabled: thin liquidity, contributes phantom V2 routes
  # - id: "alienbase-v2"
  #   name: "Alien Base (Base)"
  #   address: "0x8c1A3cF8f83074169FE5D7aD50B978e1cD6b37c7"
  #   type: "v2"
  #   fee_bps: 12  # 0.12% protocol fee

  # SushiSwap V3: factory confirmed (0xc35DADB65012eC5796536bD9864eD8773aBc74C4) but
  # SwapRouter + QuoterV2 addresses not found in official docs — skipped until confirmed.


