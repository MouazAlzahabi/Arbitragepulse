    enabled: false  # Switched to Base — re-enable after bridging back if needed
    ws_rpc: "wss://linea-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
    http_rpc: "https://linea-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
    native_currency: "ETH"
    wrapped_native: "0xe5d7c2a44ffddf6b295a15c148167daaaf5cf34f"
    block_time_ms: 2000  # 2 second blocks
    contract_address: "0xb4DA83518bc53c54482ccFacAC7D9c828869829b"
    min_native_balance: 0.01
    min_profit_usd: 0.001   # Minimum NET profit after gas. Lowered for testing; raise once confirmed working.
    deadline_seconds: 120
    min_swap_amount_filter: 10000000  # 10 USDC minimum (reduced to catch more opportunities)
    # Chain-level fallback quoter — used for routers that don't have their own quoter_address.
    # Set to Uniswap's QuoterV2 (deepest liquidity → most accurate ETH price).
    quoter_v2_address: "0x42bE4D6527829FeFA1493e1fb9F3676d2425C3C1"  # Uniswap V3 QuoterV2 (Linea)
    ws_rpc_fallbacks:
      - "wss://rpc.linea.build"  # Public fallback
    # Max concurrent Multicall3 chunks per scan.
    # Each chunk = 1 eth_call (26 CU). Free plan (330 CU/s): 3. Growth plan (3000 CU/s): 10.
    rpc_concurrency: 3
    # How often to scan between blocks (milliseconds). Aligned with Linea 2s block cadence
    # to prevent poll_tick from firing between blocks (which doubled scan rate to ~45/min).
    scan_interval_ms: 2000


