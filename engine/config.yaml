# ─── ROUTERS ──────────────────────────────────────────────
# type: "v2" = Uniswap V2-compatible (getAmountsOut + swapExactTokensForTokens)
#        "v3" = Uniswap V3-compatible (QuoterV2.quoteExactInputSingle + exactInputSingle)
# fee_tiers: V3 only — fee tiers to try (in bps*100): 500=0.05%, 3000=0.3%, 10000=1%

routers:
  # ── Optimism mainnet routers — DISABLED for local fork testing ──
  # Uncomment when connecting to real Optimism mainnet (not local Anvil fork).
