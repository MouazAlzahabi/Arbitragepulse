# ============================================================
# ArbitragePulse — Token Allowlist
# ============================================================
#
# HOW IT WORKS:
#   1. Add tokens you trust to the list below
#   2. The engine auto-generates ALL valid pair combinations
#   3. Example: 5 tokens = 20 directional pairs, checked automatically
#
# ADDING A NEW TOKEN:
#   Just add a block under the right chain. The engine handles the rest.
#
#   - symbol: "LINK"
#     address: "0x350a791Bfc2C21F9Ed5d10980Dad2e2638ffa7f6"
#     decimals: 18
#     trusted: true
#
# FIELDS:
#   symbol:     Human-readable ticker
#   address:    Contract address (checksummed)
#   decimals:   Token decimals (18 for most, 6 for USDC/USDT)
#   trusted:    true = actively trade, false = monitor only (no execution)
#   category:   "stable" | "blue_chip" | "defi" | "meme" | "other"
#               Used for trade sizing — stables and blue chips get larger sizes
#   max_trade:  (optional) Override max trade amount for this token
#               If not set, uses defaults based on category
#
# ⚠️  SAFETY:
#   - Only add tokens you've verified (check on block explorer)
#   - Avoid rebasing tokens (OHM, AMPL) — they break V2 router math
#   - Avoid fee-on-transfer tokens — they'll cause reverts
#   - When in doubt, set trusted: false first and monitor
# ============================================================

# ── Trade sizing defaults per category ──
defaults:
  trade_sizes:
    stable:     "150"      # $150 per arb
    blue_chip:  "0.05"     # 0.05 ETH per arb (~$150)
    defi:       "0.03"     # Smaller for mid-caps
    meme:       "0.01"     # Smallest for volatile tokens
    other:      "0.02"
  min_swap_sizes:
    stable:     "10"
    blue_chip:  "0.005"
    defi:       "0.005"
    meme:       "0.002"
    other:      "0.005"


