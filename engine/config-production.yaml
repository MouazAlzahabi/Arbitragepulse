# ════════════════════════════════════════════════════════
# DEPLOYMENT COMMANDS (for reference)
# ════════════════════════════════════════════════════════
#
# After deploying contracts, set router permissions:
#
# LINEA:
#   cast send $CONTRACT "setAllowedRouter(address,bool)" 0x1b81d678ffb9c0263b24a97847620c99d213eb14 true --rpc-url $LINEA_RPC --private-key $PK
#   cast send $CONTRACT "setRouterType(address,uint8)" 0x1b81d678ffb9c0263b24a97847620c99d213eb14 0 --rpc-url $LINEA_RPC --private-key $PK
#   cast send $CONTRACT "setAllowedRouter(address,bool)" 0xAAA45c8F5ef92a000a121d102F4e89278a711Faa true --rpc-url $LINEA_RPC --private-key $PK
#   cast send $CONTRACT "setRouterType(address,uint8)" 0xAAA45c8F5ef92a000a121d102F4e89278a711Faa 0 --rpc-url $LINEA_RPC --private-key $PK
#
# SCROLL:
#   cast send $CONTRACT "setAllowedRouter(address,bool)" 0x0122960d6e391478bfe8fb2408ba412d5600f621 true --rpc-url $SCROLL_RPC --private-key $PK
#   cast send $CONTRACT "setRouterType(address,uint8)" 0x0122960d6e391478bfe8fb2408ba412d5600f621 0 --rpc-url $SCROLL_RPC --private-key $PK
#   cast send $CONTRACT "setAllowedRouter(address,bool)" 0x80e38291e06339d10aab483c65695d004dbd5c69 true --rpc-url $SCROLL_RPC --private-key $PK
#   cast send $CONTRACT "setRouterType(address,uint8)" 0x80e38291e06339d10aab483c65695d004dbd5c69 0 --rpc-url $SCROLL_RPC --private-key $PK
#
# GNOSIS:
#   cast send $CONTRACT "setAllowedRouter(address,bool)" 0x1C232F01118CB8B424793ae03F870aa7D0ac7f77 true --rpc-url $GNOSIS_RPC --private-key $PK
#   cast send $CONTRACT "setRouterType(address,uint8)" 0x1C232F01118CB8B424793ae03F870aa7D0ac7f77 0 --rpc-url $GNOSIS_RPC --private-key $PK
#   cast send $CONTRACT "setAllowedRouter(address,bool)" 0x1b02dA8Cb0d097eB8D57A175b88c7D8b47997506 true --rpc-url $GNOSIS_RPC --private-key $PK
#   cast send $CONTRACT "setRouterType(address,uint8)" 0x1b02dA8Cb0d097eB8D57A175b88c7D8b47997506 0 --rpc-url $GNOSIS_RPC --private-key $PK
#
# ════════════════════════════════════════════════════════
