    token_out: "0xe5d7c2a44ffddf6b295a15c148167daaaf5cf34f"  # WETH (verified)
    token_in_symbol: "USDC"
    token_out_symbol: "WETH"
    token_in_decimals: 6
    token_out_decimals: 18
    trade_amount: "100"  # Start with $100 trades
    max_trade: "500"  # Cap at $500 to avoid slippage
    min_swap_size: "10"
    watch_pools: []

