# ============================================================
# ArbitragePulse Engine — Base Sepolia (testing stage)
# ============================================================
# Same engine, same format as config.yaml — only the chain and its addresses differ.
# Run it as its own instance (own .env with a TESTNET key, PORT and DB), with
# DRY_RUN=true first. See TESTNET_DEPLOYMENT_GUIDE.md.
#
# Base Sepolia has little real DEX liquidity, so the testing stage trades mock tokens
# on the REAL Uniswap V2 and V3 deployments: contract/script/DeployMocks.s.sol creates
# mUSDC/mWETH and seeds them ~3% apart on the two DEXes. The engine finds them through
# its normal pool discovery — the same code path as mainnet.
# ============================================================


# ─── CHAIN ─────────────────────────────────────────────────
chain:
  id: 84532
  name: "Base Sepolia"
  ws_rpc: "wss://base-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
  http_rpc: "https://sepolia.base.org"
  native_currency: "ETH"
  wrapped_native: "0x4200000000000000000000000000000000000006"
  block_time_ms: 2000
  # ArbitrageExecutor deployed to Base Sepolia (forge script script/Deploy.s.sol).
  contract_address: "YOUR_BASE_SEPOLIA_EXECUTOR"
  min_native_balance: 0.001
  min_profit_usd: 0.01
  deadline_seconds: 120
  quoter_v2_address: "0xC5290058841028F1614F3A6F0F5816cAd0df5E27"  # Uniswap V3 QuoterV2 (Base Sepolia)
  scan_interval_ms: 2000
  rpc_concurrency: 3
  # preconf_ws_rpc / preconf_http_rpc: no public Base Sepolia Flashblocks log endpoint
  # found (2026-10-22) — off.
  ws_rpc_fallbacks:
    - "wss://base-sepolia-rpc.publicnode.com"
  submission_rpcs: []
  optimistic_submission: false
  preflight_eth_call: true       # testnet: simulate every send and log revert reasons
  optimize_size: false
  priority_fee_wei: 1000000      # 1 Mwei — no competition on testnet
  pending_tx_monitoring: false
  pending_only_submission: false
  poll_logs_fallback: false


# ─── ROUTERS ───────────────────────────────────────────────
routers:
  # Addresses verified on-chain (2026-10-16): factory/router/quoter have code, and the
  # router's factory() returns this factory. USDC/WETH pools exist at 500/3000/10000.
  - id: "uniswap-v3-base-sepolia"
    name: "Uniswap V3 (Base Sepolia)"
    address: "0x94cC0AaC535CCDB3C01d6787D6413C739ae12bc4"  # SwapRouter02
    type: "v3"
    fee_tiers: [500, 3000, 10000]
    fee_bps: 0
    quoter_address: "0xC5290058841028F1614F3A6F0F5816cAd0df5E27"  # QuoterV2
    factory_address: "0x4752ba5DBc23f44D87826276BF6Fd6b1C372aD24"  # UniswapV3Factory

  # Verified on-chain (2026-10-16): router.factory() returns this factory and
  # router.WETH() is Base Sepolia WETH. Execution needs setRouter(addr, 0).
  - id: "uniswap-v2-base-sepolia"
    name: "Uniswap V2 (Base Sepolia)"
    address: "0x1689E7B1F10000AE47eBfE339a4f69dECd19F602"  # UniswapV2Router02
    type: "v2"
    fee_bps: 30
    factory_address: "0x7Ae58f10f7849cA6F5fB71b7f45CB416c9204b1e"  # UniswapV2Factory


# ─── PAIRS ─────────────────────────────────────────────────
pairs:
  - id: "base-sepolia-usdc-weth"
    token_in: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"   # USDC (Circle, Base Sepolia)
    token_out: "0x4200000000000000000000000000000000000006"   # WETH
    token_in_symbol: "USDC"
    token_out_symbol: "WETH"
    token_in_decimals: 6
    token_out_decimals: 18
    trade_amount: "10"
    max_trade: "10"

  # Mock-token pair seeded by DeployMocks.s.sol (V2 at 2500, V3 at 2575 mUSDC/mWETH).
  # Uncomment and paste the token addresses the script prints.
  # - id: "base-sepolia-mock-usdc-weth"
  #   token_in: "YOUR_MUSDC"
  #   token_out: "YOUR_MWETH"
  #   token_in_symbol: "USDC"
  #   token_out_symbol: "WETH"
  #   token_in_decimals: 18
  #   token_out_decimals: 18
  #   trade_amount: "100"
  #   max_trade: "100"


# ─── TUNING ────────────────────────────────────────────────
# Defaults (see config.yaml for the full list) suit Base Sepolia's 2 s blocks.
# Testnet: trip the circuit breaker early so misconfigurations surface fast.
tuning:
  max_consecutive_failures: 5
