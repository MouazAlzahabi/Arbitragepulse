# ════════════════════════════════════════════════════════
# TESTNET DEPLOYMENT NOTES
# ════════════════════════════════════════════════════════
#
# 1. GET TESTNET ETH/MATIC
#    - Linea Sepolia: https://faucet.sepolia.linea.build
#    - Scroll Sepolia: https://sepolia.scroll.io/faucet
#    - Optimism Sepolia: https://app.optimism.io/faucet
#    - Arbitrum Sepolia: https://faucet.quicknode.com/arbitrum/sepolia
#    - Polygon Amoy: https://faucet.polygon.technology
#    - Gnosis Chiado: https://gnosisfaucet.com
#
# 2. DEPLOY CONTRACT
#    For each testnet:
#    ```bash
#    export TESTNET_RPC="https://rpc.sepolia.linea.build"  # Example
#    export PRIVATE_KEY="0xYOUR_TESTNET_PRIVATE_KEY"
#
#    forge create \
#      --rpc-url $TESTNET_RPC \
#      --private-key $PRIVATE_KEY \
#      src/ArbitrageExecutor.sol:ArbitrageExecutor
#
#    # Update contract_address in this config for that chain
#    ```
#
# 3. DEPLOY MOCK ROUTERS (Recommended)
#    Testnets have limited DEX liquidity. Deploy MockRouters for reliable testing:
#
#    a. Deploy MockRouterV2 contracts (2 per chain for arbitrage)
#    b. Deploy MockERC20 tokens (USDC, WETH)
#    c. Seed routers with liquidity
#    d. Set different exchange rates to create arbitrage spread
#
#    See lab/src/setup.rs for reference implementation.
#
# 4. SET ROUTER PERMISSIONS
#    ```bash
#    cast send $CONTRACT_ADDRESS \
#      "setAllowedRouter(address,bool)" \
#      $ROUTER_ADDRESS \
#      true \
#      --rpc-url $TESTNET_RPC \
#      --private-key $PRIVATE_KEY
#
#    cast send $CONTRACT_ADDRESS \
#      "setRouterType(address,uint8)" \
#      $ROUTER_ADDRESS \
#      0 \
#      --rpc-url $TESTNET_RPC \
#      --private-key $PRIVATE_KEY
#    ```
#
# 5. FUND CONTRACT
#    - Transfer testnet USDC/tokens to contract
#    - Ensure contract has enough ETH/MATIC for gas
#
# 6. RUN ENGINE
#    ```bash
#    PRIVATE_KEY=$PRIVATE_KEY \
#      CONFIG_PATH=/path/to/config-testnet.yaml \
#      cargo run -p engine
#    ```
#
# 7. TEST IN DRY-RUN MODE FIRST
#    - Let engine run for 30+ minutes
#    - Verify opportunities detected
#    - Check logs for errors
#    - Enable live mode only after dry-run succeeds
#
# ════════════════════════════════════════════════════════
